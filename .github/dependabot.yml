# VOTAR-488 — actualizaciones de versión. Las alertas CVE y los security
# updates ya estaban habilitados en la configuración de Security del repo;
# este archivo agrega PRs automáticos de dependencias desactualizadas.
# Sin groups: cada dependencia abre su propio PR (limitado a 5 abiertos)
# para que un CVE urgente (p.ej. @openzeppelin/contracts) no quede atado
# a un bump breaking no relacionado.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Cordoba
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Los majors de estas dependencias requieren migrar la toolchain y no se
    # resuelven con un bump: Hardhat 3 exige proyecto ESM + plugins nuevos
    # (hardhat-toolbox 7 solo soporta Hardhat 3), y TypeScript 7 es
    # incompatible con ts-node 10, del que depende Hardhat 2. Solo se ignoran
    # los version updates major: los security updates siguen habilitados.
    ignore:
      - dependency-name: hardhat
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-toolbox"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Cordoba
    open-pull-requests-limit: 5
    labels:
      - dependencies
