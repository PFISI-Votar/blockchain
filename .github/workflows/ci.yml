name: Continuous Integration

on:
  push:
    branches:
      - dev
      - master

  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests on isolated Hardhat network
        run: npm test

  slither:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Slither static analysis (fail on medium+)
        id: slither
        continue-on-error: true
        uses: crytic/slither-action@v0.4.2
        with:
          fail-on: medium
          slither-args: >-
            --filter-paths "node_modules/|@openzeppelin/"
            --checklist
            --markdown-root ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/

      - name: Generate Slither HTML report
        if: always()
        env:
          SLITHER_REPORT: ${{ steps.slither.outputs.stdout }}
        run: node .github/scripts/slither-to-html.js

      - name: Upload Slither HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: reports/slither-report.html
          if-no-files-found: error

      - name: Fail job if Slither found medium+ issues
        if: steps.slither.outcome == 'failure'
        run: |
          echo "Slither detected findings at medium severity or higher."
          exit 1
