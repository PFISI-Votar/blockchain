name: Continuous Integration

on:
  push:
    branches:
      - dev
      - master

  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read
  security-events: write

jobs:
  # VOTAR-488: el ruleset exige el check `test`. El job homónimo más abajo
  # solo pasa si los tests, CodeQL y secret scanning pasan, así que un
  # hallazgo crítico o un secreto bloquean el merge sin cambiar el ruleset.
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  secret-scanning:
    uses: ./.github/workflows/secret-scanning.yml
    permissions:
      contents: read

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests on isolated Hardhat network
        run: npm test

  test:
    needs: [quality, codeql, secret-scanning]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require tests, CodeQL and secret scanning
        env:
          QUALITY: ${{ needs.quality.result }}
          CODEQL: ${{ needs.codeql.result }}
          SECRETS: ${{ needs.secret-scanning.result }}
        run: |
          set -eu
          failed=0
          for name in QUALITY CODEQL SECRETS; do
            result="${!name}"
            echo "$name=$result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"

  # VOTAR-351 — análisis estático obligatorio (Slither).
  # MythX queda fuera de alcance (API comercial / presupuesto cero); ver
  # docs/VOTAR-351-auditoria-smart-contracts.md.
  slither:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Slither reports directory
        run: mkdir -p reports

      - name: Run Slither static analysis (threshold from slither.config.json)
        id: slither
        continue-on-error: true
        uses: crytic/slither-action@v0.4.2
        with:
          # fail_on / filter_paths / detectors_to_exclude / triage_database
          # viven en slither.config.json (umbrales editables por el equipo).
          fail-on: config
          slither-config: slither.config.json
          slither-args: >-
            --checklist
            --markdown-root ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/
            --json reports/slither-native.json

      - name: Generate Slither reports (Markdown, JSON, HTML)
        if: always()
        env:
          SLITHER_REPORT: ${{ steps.slither.outputs.stdout }}
        run: node .github/scripts/generate-slither-reports.js

      - name: Upload Slither reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: |
            reports/slither-report.md
            reports/slither-report.json
            reports/slither-report.html
          if-no-files-found: error

      - name: Fail job if Slither found medium+ issues
        if: steps.slither.outcome == 'failure'
        run: |
          echo "Slither detected findings at or above the configured fail_on threshold (see slither.config.json)."
          exit 1
