# VOTAR-488 — gate de secretos en el árbol que se va a mergear.
# GitHub Secret Scanning + push protection ya cubren el historial y los
# pushes. Este job falla el check requerido si el tip del PR todavía
# contiene un secreto.
#
# Usamos el CLI OSS con versión+checksum pineados en lugar de
# gitleaks/gitleaks-action: esa action exige GITLEAKS_LICENSE en repos de
# organización, y `gitleaks dir` escanea exactamente el working tree a
# mergear (no todo el historial).
name: Secret scanning

on:
  workflow_call:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "${archive}"
          echo "${checksum}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          install gitleaks /usr/local/bin/gitleaks

      - name: Scan working tree for secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --exit-code 1
